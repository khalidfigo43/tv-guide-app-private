name: Daily TV Schedules Sync (Africa/Cairo 00:00 Midnight)

on:
  schedule:
    # 21:00 UTC = 00:00 Cairo in Summer (UTC+3)
    # 22:00 UTC = 00:00 Cairo in Winter (UTC+2)
    # check_cairo_midnight.py ensures execution strictly once per day at 00:00 Cairo time
    - cron: '0 21,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests urllib3 lxml cryptography tzdata

      - name: Verify Africa/Cairo Midnight Schedule
        id: check_time
        run: |
          python scripts/check_cairo_midnight.py "${{ github.event_name }}"

      - name: Run Multi-Source Dynamic Future Date Pipeline & Validation
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          python generate_fresh_daily_schedules.py

      - name: Commit and Push to Private Repository
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedules.json data/metadata.json android/app/src/main/assets/schedules.json android/app/src/main/assets/metadata.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily schedule sync [$(date -u +'%Y-%m-%d')]" && git push)

      - name: Publish to Public Releases Repository (tv-guide-releases)
        if: steps.check_time.outputs.should_run == 'true'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GH_PAT }}
        run: |
          python scripts/publish_to_releases.py
