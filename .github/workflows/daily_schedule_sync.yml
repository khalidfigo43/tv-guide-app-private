name: Daily TV Schedules Sync

on:
  schedule:
    # Runs everyday at 00:00 UTC (03:00 AM Cairo/Riyadh)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests okhttp urllib3 lxml

      - name: Run Daily Schedule Scraper & Sync
        run: |
          python generate_fresh_daily_schedules.py

      - name: Commit and Push Updated Schedules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedules.json android/app/src/main/assets/schedules.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily schedule sync [$(date -u +'%Y-%m-%d')]" && git push)
